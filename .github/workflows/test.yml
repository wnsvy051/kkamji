name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mlx-whisper는 Apple Silicon 전용이라 여기서는 설치되지 않음 (pyproject 환경 표식).
      # 후처리 로직은 Whisper 없이 테스트 가능.
      - run: pip install -e ".[dev]"
      - run: pytest -q
